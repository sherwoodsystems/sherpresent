<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SherPresent Captions</title>
<style>
  /* Every value here is retuned live over the socket (see applySettings).
     --size is unitless on purpose: it is multiplied by a length below, and
     CSS rejects length x length, which silently voids the whole rule. */
  :root {
    --chroma: {{CHROMA}};
    --size: {{FONT_SIZE}};
    --lines: {{MAX_LINES}};
    --safe: {{SAFE}}%;
    --width: {{WIDTH}}%;
    --leading: 1.22;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    /* Nothing here is interactive; a stray tap must never scroll or select. */
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
  }

  body.transparent, body.transparent #frame { background: transparent; }

  /* The keyable surface. Sized to fill the viewport while holding 16:9, so
     the same URL works in a 1920x1080 browser source and in a fullscreen
     browser on a letterboxed display. */
  #frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 16 / 9;
    width: 100%;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    background: var(--chroma);
    /* Establishes the query container. Note the font-size lives on the
       children: container units on the container element itself resolve
       against an *ancestor*, which is not what we want here. */
    container-type: size;
  }

  /* Type scales with the frame, not the window, so a 1280-wide preview and a
     1920 program feed look identical. --size is px at 1920 wide. */
  #lines { font-size: calc(var(--size) * 100cqw / 1920); }
  #status { font-size: calc(18 * 100cqw / 1920); }

  @supports not (container-type: size) {
    /* Fallback: vw-relative. Correct whenever the frame spans the viewport
       width, which is the common browser-source case. */
    #lines { font-size: calc(var(--size) * 100vw / 1920); }
    #status { font-size: calc(18 * 100vw / 1920); }
  }

  /* A fixed window exactly --lines text rows tall, bottom-anchored: however
     long a sentence runs, it wraps upward and the oldest rows clip off the
     top, like broadcast roll-up captions. Counting segments instead let one
     long sentence fill half the frame. No gap between lines, so rows stay on
     a --leading grid and the clip always falls between rows, never mid-glyph. */
  #lines {
    position: absolute;
    left: calc((100% - var(--width)) / 2);
    width: var(--width);
    bottom: var(--safe);
    height: calc(var(--lines) * var(--leading) * 1em);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
  }

  .line {
    flex-shrink: 0;
    font-size: 1em;
    line-height: var(--leading);
    font-weight: 650;
    text-align: center;
    color: #fff;
    text-wrap: balance;
    /* Latency matters more than polish; no entry animation on the live line. */
  }

  /* Opt-in (Settings, or ?shadow=1). A shadow rather than a filled box: a
     translucent plate would pick up the chroma colour underneath and key out
     with the background. */
  body.shadow .line {
    text-shadow:
      0 0 0.09em rgba(0, 0, 0, 0.95),
      0 0.035em 0.05em rgba(0, 0, 0, 0.9),
      0 0 0.28em rgba(0, 0, 0, 0.55);
  }

  /* Opt-in (Settings, or ?box=1): closed-caption style. Opaque on purpose —
     a translucent plate would show the key colour through and key out with
     it. `clone` gives every wrapped row its own box instead of one ragged
     shape spanning the rows. */
  body.boxed .line .text {
    background: #000;
    padding: 0 0.3em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  .line .source {
    display: block;
    font-size: 0.62em;
    font-weight: 500;
    opacity: 0.8;
  }

  /* Connection trouble indicator. Deliberately tiny and in the top-left,
     outside the caption safe area, so it is easy to crop or ignore on air. */
  #status {
    position: absolute;
    top: 1.5%;
    left: 1.5%;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(0, 0, 0, 0.55);
    padding: 0.4em 0.7em;
    border-radius: 0.3em;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #status.show { opacity: 1; }
  body.clean #status { display: none; }
</style>
</head>
<body>
  <div id="frame">
    <div id="lines"></div>
    <div id="status"></div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var root = document.documentElement.style;
  var SHOW_SOURCE = params.get('source') === '1' || params.get('text') === 'both';
  var TEXT_MODE = params.get('text') === 'source' ? 'source' : 'translated';

  // Seconds of silence before the lines clear; 0 = never. See armClear.
  var clearAfter = params.has('clear') ? Math.max(0, parseFloat(params.get('clear')) || 0) : {{CLEAR_AFTER}};
  var clearTimer = null;

  // How many segments to keep in the DOM. The row-height window in CSS does
  // the real limiting; this just bounds the work, generously, since a single
  // segment is rarely shorter than one row.
  var keepSegments = {{MAX_LINES}} * 2 + 2;

  function setChroma(c) {
    root.setProperty('--chroma', c);
    document.body.classList.toggle('transparent', c === 'transparent');
  }
  setChroma('{{CHROMA}}');

  if (params.get('clean') === '1') {
    document.body.classList.add('clean');
  }
  if (params.has('shadow')) {
    document.body.classList.toggle('shadow', params.get('shadow') === '1');
  }
  if (params.has('box')) {
    document.body.classList.toggle('boxed', params.get('box') === '1');
  }

  // Live styling from Settings. The server already sanitized and clamped
  // every field; anything pinned in the URL keeps its URL value, so an OBS
  // source configured by hand is never retuned from the app.
  function applySettings(s) {
    if (!params.has('size') && s.fontSize) root.setProperty('--size', s.fontSize);
    if (!params.has('lines') && s.maxLines) {
      root.setProperty('--lines', s.maxLines);
      keepSegments = s.maxLines * 2 + 2;
      render();
    }
    if (!params.has('safe') && s.safeArea != null) root.setProperty('--safe', s.safeArea + '%');
    if (!params.has('width') && s.width) root.setProperty('--width', s.width + '%');
    if (!params.has('bg') && s.chromaColor) setChroma(s.chromaColor);
    if (!params.has('shadow')) document.body.classList.toggle('shadow', !!s.shadow);
    if (!params.has('box')) document.body.classList.toggle('boxed', !!s.background);
    if (!params.has('clear') && s.clearAfter != null && s.clearAfter !== clearAfter) {
      clearAfter = s.clearAfter;
      armClear();
    }
  }

  var linesEl = document.getElementById('lines');
  var statusEl = document.getElementById('status');

  // Finalized lines, oldest first. The in-progress line is tracked separately
  // because it is replaced on every delta rather than appended.
  var finals = [];
  var live = null;

  // Whether the current session translates at all; set from caption-status
  // messages. While it's true, an empty `translated` means "not ready yet",
  // not "no translation" — falling back to source would flash English before
  // French on every new line.
  var TRANSLATE_ENABLED = false;
  var lastGoodTranslated = { id: null, text: '' };

  function textOf(seg) {
    if (TEXT_MODE === 'source') return seg.source || '';
    if (!TRANSLATE_ENABLED) return seg.translated || seg.source || '';
    if (seg.translated) {
      lastGoodTranslated = { id: seg.id, text: seg.translated };
      return seg.translated;
    }
    return (lastGoodTranslated.id === seg.id) ? lastGoodTranslated.text : '';
  }

  function render() {
    var shown = finals.slice();
    if (live && textOf(live).trim()) shown.push(live);
    shown = shown.slice(-keepSegments);

    linesEl.innerHTML = '';
    shown.forEach(function (seg) {
      var div = document.createElement('div');
      div.className = 'line';

      if (SHOW_SOURCE && seg.source && TEXT_MODE !== 'source') {
        var src = document.createElement('span');
        src.className = 'source';
        src.textContent = seg.source;
        div.appendChild(src);
      }

      var text = document.createElement('span');
      text.className = 'text';
      text.textContent = textOf(seg);
      div.appendChild(text);
      linesEl.appendChild(div);
    });
  }

  // Clear the screen after `clearAfter` seconds with no caption activity, so a
  // pause in the talk doesn't leave the last sentence hanging on air. Only the
  // display clears; the next words start a fresh screen.
  function armClear() {
    if (clearTimer) clearTimeout(clearTimer);
    clearTimer = null;
    if (clearAfter > 0 && (finals.length || live)) {
      clearTimer = setTimeout(function () {
        finals = [];
        live = null;
        render();
      }, clearAfter * 1000);
    }
  }

  function applySegment(seg) {
    if (seg.final) {
      // The live line and the finalized line share an id; replace, never
      // append, or every completed line shows twice.
      if (live && live.id === seg.id) live = null;
      if (!finals.length || finals[finals.length - 1].id !== seg.id) {
        finals.push(seg);
      } else {
        finals[finals.length - 1] = seg;
      }
      if (finals.length > keepSegments) finals = finals.slice(-keepSegments);
    } else {
      live = seg;
    }
    render();
    armClear();
  }

  function showStatus(text) {
    if (!text) {
      statusEl.classList.remove('show');
      return;
    }
    statusEl.textContent = text;
    statusEl.classList.add('show');
  }

  function applyStatus(status) {
    TRANSLATE_ENABLED = !!(status && status.translateEnabled);

    var state = status && status.state;
    if (typeof state === 'object' && state !== null && 'error' in state) {
      showStatus('error: ' + state.error);
    } else if (state === 'reconnecting') {
      showStatus('reconnecting');
    } else if (state === 'stopped') {
      showStatus('captions off');
    } else if (state === 'starting') {
      showStatus('starting');
    } else {
      showStatus(null);
    }
  }

  // --- WebSocket with reconnect --------------------------------------------
  // This page runs unattended for hours on a machine nobody is watching, so
  // it must recover from the app restarting without anyone touching it.
  var ws = null;
  var retry = 500;

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/api/captions/ws');

    ws.onopen = function () {
      retry = 500;
      showStatus(null);
    };

    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.type === 'segment' && msg.segment) {
        applySegment(msg.segment);
      } else if (msg.type === 'status' && msg.status) {
        applyStatus(msg.status);
      } else if (msg.type === 'replay' && Array.isArray(msg.segments)) {
        finals = msg.segments.slice(-keepSegments);
        live = null;
        render();
        armClear();
      } else if (msg.type === 'settings' && msg.settings) {
        applySettings(msg.settings);
      }
    };

    ws.onclose = function () {
      showStatus('disconnected');
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 5000);
    };

    ws.onerror = function () {
      if (ws) ws.close();
    };
  }

  connect();
})();
</script>
</body>
</html>

services:
  bridge:
    build:
      context: ../../..
      dockerfile: apps/bridge/docker/Dockerfile
    network_mode: "host"
    volumes:
      - bridge-config:/etc/rpi-osc-bridge
      - bridge-runtime:/var/run/rpi-osc-bridge

  bridge-test:
    build:
      context: ../../..
      dockerfile: apps/bridge/docker/Dockerfile
    command: python3 -m pytest tests/ -v
    working_dir: /opt/rpi-osc-bridge
    profiles: ["test"]

volumes:
  bridge-config:
  bridge-runtime:

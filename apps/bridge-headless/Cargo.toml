[package]
name = "bridge-headless"
version = "0.1.0"
description = "Headless SherPresent Bridge binary for Raspberry Pi / server deployment"
authors = ["SherPresent"]
edition = "2021"

[[bin]]
name = "bridge-headless"
path = "src/main.rs"

[dependencies]
sherpresent-bridge-core = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
log = "0.4"
env_logger = "0.11"

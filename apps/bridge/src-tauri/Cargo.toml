[package]
name = "bridge"
version = "0.1.0"
description = "SherPresent Bridge — USB clicker -> OSC"
authors = ["SherPresent"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bridge core logic (USB, OSC, mDNS, HTTP config API).
sherpresent-bridge-core = { workspace = true }

# Shared mDNS discovery helpers (local IP, peer types).
sherpresent-core = { workspace = true }

# tokio: used by Tauri commands that bridge into the core runtime.
tokio = { version = "1", features = ["sync"] }

# log + env_logger: logging (RUST_LOG env var).
log = "0.4"
env_logger = "0.11"


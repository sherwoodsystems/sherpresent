[package]
name = "bridge"
version = "0.1.0"
description = "SherPresent Bridge — USB clicker -> OSC"
authors = ["SherPresent"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared mDNS discovery helpers (local IP, peer types).
sherpresent-core = { workspace = true }

# tokio: async runtime for OSC + mDNS and the Tauri command bridge.
tokio = { version = "1", features = ["net", "time", "sync", "rt-multi-thread", "macros"] }

# log + env_logger: logging (RUST_LOG env var).
log = "0.4"
env_logger = "0.11"

# uuid: generate bridge_id on first run.
uuid = { version = "1", features = ["v4", "serde"] }

# rosc: OSC protocol parsing/encoding (matches desktop app).
rosc = "0.10"

# chrono: ISO-8601 timestamps for feedback state snapshots.
chrono = { version = "0.4", features = ["serde"] }

# if-addrs: network interface enumeration.
if-addrs = "0.13"

# dirs: cross-platform config directory resolution.
dirs = "5"

# Linux-specific: USB HID via evdev.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.12", features = ["tokio"] }

[dev-dependencies]
tokio-test = "0.4"


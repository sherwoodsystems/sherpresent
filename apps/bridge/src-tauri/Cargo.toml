[package]
name = "bridge"
version = "0.1.0"
description = "SherPresent Bridge — USB clicker -> OSC"
authors = ["SherPresent"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared mDNS discovery, peer types.
sherpresent-core = { workspace = true }

# tokio: Async runtime for OSC + mDNS + HTTP API.
tokio = { version = "1", features = ["net", "time", "sync", "rt-multi-thread", "macros"] }

# log + env_logger: logging (RUST_LOG env var).
log = "0.4"
env_logger = "0.11"

# uuid: Generate bridge_id on first run.
uuid = { version = "1", features = ["v4"] }

# rosc: OSC protocol parsing/encoding (matches desktop app).
rosc = "0.10"

# chrono: ISO-8601 timestamps for feedback state snapshots (matches Python bridge format).
chrono = { version = "0.4", features = ["serde"] }

# if-addrs: network interface enumeration (for OSC broadcast / sanity checks).
if-addrs = "0.13"

# Required for HTTP config API (Step 7).
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", features = ["json"] }

# Linux-specific: USB HID via evdev (Step 5).
[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.12", features = ["tokio"] }


[project]
name = "rpi-osc-bridge"
version = "2.1.0"
description = "USB presentation clicker to OSC bridge for Raspberry Pi"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "evdev>=1.6.0",
    "python-osc>=1.8.0",
]

[project.scripts]
rpi-osc-bridge = "rpi_osc_bridge.bridge:main"
rpi-osc-config = "rpi_osc_bridge.config_server:main"

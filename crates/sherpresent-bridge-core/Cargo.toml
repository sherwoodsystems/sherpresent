[package]
name = "sherpresent-bridge-core"
version = "0.1.0"
description = "Core bridge logic for SherPresent — USB clicker detection, OSC, mDNS, and HTTP config API"
authors = ["SherPresent"]
edition = "2021"

[lib]
name = "sherpresent_bridge_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared mDNS discovery, peer types.
sherpresent-core = { workspace = true }

# tokio: Async runtime for OSC + mDNS + HTTP API.
tokio = { version = "1", features = ["net", "time", "sync", "rt-multi-thread", "macros"] }

# log + env_logger: logging (RUST_LOG env var).
log = "0.4"
env_logger = "0.11"

# uuid: Generate bridge_id on first run.
uuid = { version = "1", features = ["v4", "serde"] }

# rosc: OSC protocol parsing/encoding (matches desktop app).
rosc = "0.10"

# chrono: ISO-8601 timestamps for feedback state snapshots.
chrono = { version = "0.4", features = ["serde"] }

# if-addrs: network interface enumeration.
if-addrs = "0.13"

# HTTP config API.
axum = { version = "0.8", features = ["ws"] }

# dirs: cross-platform config directory resolution (replaces Tauri path resolver).
dirs = "5"

# Linux-specific: USB HID via evdev.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.12", features = ["tokio"] }

[dev-dependencies]
tokio-test = "0.4"
serde_json = "1"

# Windows installers (MSI + NSIS) for the desktop app.
#
# Run it from the Actions tab ("Run workflow") and download the installers
# from the run's artifacts, or push a `v*` tag (e.g. v1.1.1) to also attach
# them to a draft GitHub Release.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # attach installers to the release on tag builds

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # The Cargo workspace is at the repo root, so target/ is too.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build installers
        run: bun tauri build --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: SherPresent-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
